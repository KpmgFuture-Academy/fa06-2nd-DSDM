<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <title>프로젝트 WBS 간트 차트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; background:#f8fafc; color:#1e293b; }
    /* 스크롤바 */
    ::-webkit-scrollbar{ width:8px; height:8px; }
    ::-webkit-scrollbar-track{ background:#e2e8f0; }
    ::-webkit-scrollbar-thumb{ background:#94a3b8; border-radius:10px; }
    ::-webkit-scrollbar-thumb:hover{ background:#64748b; }

    /* 배경 그리드(세로선) */
    .gantt-grid-bg {
      background-size: calc(100% / var(--days)) 100%;
      background-image: linear-gradient(to right, #e2e8f0 1px, transparent 1px);
    }
    /* Hover 팝업 */
    .task-bar-popup {
      opacity:0; visibility:hidden; position:absolute; bottom:105%; left:50%;
      transform: translateX(-50%) translateY(6px);
      transition: opacity .2s ease, visibility .2s ease, transform .2s ease;
      min-width:260px; z-index:20;
    }
    .task-bar:hover .task-bar-popup{
      opacity:1; visibility:visible; transform: translateX(-50%) translateY(0);
    }
    /* 주말 음영 */
    .weekend { background-color: rgba(148,163,184,.15); }
  </style>
</head>

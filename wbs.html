<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>프로젝트 WBS 간트 차트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; background:#f8fafc; color:#1e293b; }
    /* 스크롤바 */
    ::-webkit-scrollbar{ width:8px; height:8px; }
    ::-webkit-scrollbar-track{ background:#e2e8f0; }
    ::-webkit-scrollbar-thumb{ background:#94a3b8; border-radius:10px; }
    ::-webkit-scrollbar-thumb:hover{ background:#64748b; }

    /* 배경 그리드(세로선) */
    .gantt-grid-bg {
      background-size: calc(100% / var(--days)) 100%;
      background-image: linear-gradient(to right, #e2e8f0 1px, transparent 1px);
    }
    /* Hover 팝업 */
    .task-bar-popup {
      opacity:0; visibility:hidden; position:absolute; bottom:105%; left:50%;
      transform: translateX(-50%) translateY(6px);
      transition: opacity .2s ease, visibility .2s ease, transform .2s ease;
      min-width:260px; z-index:20;
    }
    .task-bar:hover .task-bar-popup{
      opacity:1; visibility:visible; transform: translateX(-50%) translateY(0);
    }
    /* 주말 음영 */
    .weekend { background-color: rgba(148,163,184,.15); }
  </style>
</head>
<body class="p-4 sm:p-6 md:p-10">
  <div class="max-w-screen-2xl mx-auto">
    <header class="mb-8 text-center">
      <h1 class="text-3xl sm:text-4xl font-bold">프로젝트 WBS 간트 차트</h1>
      <p class="text-slate-500 mt-2">날짜 기반 타임라인으로 시각화된 작업 분할 구조</p>
    </header>

    <!-- 범례 -->
    <div id="legend" class="flex flex-wrap gap-3 mb-4"></div>

    <!-- 차트 카드 -->
    <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200">
      <div id="gantt-chart-container" class="overflow-x-auto">
        <div id="wbs-chart"></div>
      </div>
    </div>
  </div>

  <script>
    /* ===== 1) 프로젝트 기간 설정 ===== */
    const projectStartDate = new Date("2025-09-11");
    const projectEndDate   = new Date("2025-09-18"); // 포함

    /* ===== 2) WBS 데이터 (질문에 적어주신 구조 반영) ===== */
    const wbsData = [
      {
        phase: "1. 기획",
        tasks: [
          { mid: "1.1 문제 정의", details: ["문제/목표 정립", "이해관계자 및 리스크 가설"], output:"기획서 초안",
            startDate:"2025-09-11", endDate:"2025-09-11" },
          { mid: "1.2 데이터 요구사항 정의", details:["소스/필드/주기 정의", "보안·권한 체크"], output:"데이터 요구사항서",
            startDate:"2025-09-11", endDate:"2025-09-12" },
        ]
      },
      {
        phase: "2. 데이터 수집 및 준비",
        tasks: [
          { mid: "2.1 데이터 소스 조사", details:["내부/외부 소스 목록화", "API 가능성 검토"], output:"소스 인벤토리",
            startDate:"2025-09-12", endDate:"2025-09-12" },
          { mid: "2.2 데이터 수집 및 저장", details:["크롤/추출/적재 파이프라인"], output:"원천 적재",
            startDate:"2025-09-12", endDate:"2025-09-13" },
          { mid: "2.3 데이터 전처리", details:["정합성·결측·형 변환", "스키마 통합"], output:"정제 데이터셋",
            startDate:"2025-09-13", endDate:"2025-09-14" },
        ]
      },
      {
        phase: "3. 데이터 분석 및 모델링",
        tasks: [
          { mid: "3.1 탐색/시각화", details:["EDA, 분포/상관", "세그먼트 가설"], output:"EDA 리포트",
            startDate:"2025-09-13", endDate:"2025-09-14" },
          { mid: "3.2 모델 선택/학습", details:["베이스라인→튜닝", "리스크·마케팅 타깃"], output:"학습 모델",
            startDate:"2025-09-14", endDate:"2025-09-15" },
          { mid: "3.3 성능 평가", details:["CV/홀드아웃", "비즈니스 지표 연계"], output:"평가 리포트",
            startDate:"2025-09-15", endDate:"2025-09-15" },
        ]
      },
      {
        phase: "4. 화면 기획",
        tasks: [
          { mid: "4.1 대시보드 들어갈 내용", details:["KPI·세그먼트·트렌드 탭"], output:"콘텐츠 목록",
            startDate:"2025-09-14", endDate:"2025-09-15" },
          { mid: "4.2 화면 설계(와이어)", details:["레이아웃/컴포넌트/상태"], output:"와이어프레임",
            startDate:"2025-09-15", endDate:"2025-09-16" },
          { mid: "4.3 성능 평가(프론트)", details:["렌더 성능·UX 점검"], output:"성능 체크리스트",
            startDate:"2025-09-16", endDate:"2025-09-16" },
        ]
      },
      {
        phase: "5. 결과 도출 및 보고",
        tasks: [
          { mid: "5.1 결과 요약", details:["핵심 인사이트 정리"], output:"요약본",
            startDate:"2025-09-16", endDate:"2025-09-17" },
          { mid: "5.2 보고서 작성", details:["서술·도표·부록"], output:"최종 보고서",
            startDate:"2025-09-17", endDate:"2025-09-18" },
          { mid: "5.3 최종 발표", details:["데모·Q&A 준비"], output:"발표 자료",
            startDate:"2025-09-18", endDate:"2025-09-18" },
        ]
      },
    ];

    /* ===== 3) 유틸 ===== */
    const DAY_MS = 24 * 60 * 60 * 1000;
    const dateDiffInDays = (a, b) => {
      const utc1 = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
      const utc2 = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
      return Math.floor((utc2 - utc1) / DAY_MS);
    };
    const totalDays = dateDiffInDays(projectStartDate, projectEndDate) + 1;

    // 단계 컬러 팔레트
    const phaseColors = ['#34d399','#22d3ee','#60a5fa','#a78bfa','#f472b6','#fb923c','#facc15','#a3e635'];

    /* ===== 4) 헤더(요일/일자) 생성 ===== */
    const dow = ['일','월','화','수','목','금','토'];
    let dateHeaderHTML = '';
    let weekendMask = []; // 주말 여부 기록
    for (let i=0; i<totalDays; i++){
      const d = new Date(projectStartDate);
      d.setDate(projectStartDate.getDate() + i);
      const isWeekend = d.getDay() === 0 || d.getDay() === 6;
      weekendMask.push(isWeekend);
      dateHeaderHTML += `
        <div class="text-center p-2 text-sm font-medium ${isWeekend ? 'text-slate-400' : 'text-slate-600'}">
          <div class="text-xs">${dow[d.getDay()]}</div>
          <div>${d.getDate()}</div>
        </div>`;
    }

    /* ===== 5) 차트 렌더링 ===== */
    const chartContainer = document.getElementById('wbs-chart');
    const legendContainer = document.getElementById('legend');

    // 범례
    wbsData.forEach((p, i) => {
      const c = phaseColors[i % phaseColors.length];
      const item = document.createElement('div');
      item.className = "flex items-center gap-2";
      item.innerHTML = `<span class="inline-block w-4 h-4 rounded" style="background:${c}"></span>
                        <span class="text-sm text-slate-700">${p.phase}</span>`;
      legendContainer.appendChild(item);
    });

    // 헤더 + 바디
    let html = `
      <div class="min-w-[1000px]">
        <!-- Header -->
        <div class="sticky top-0 bg-white/75 backdrop-blur-sm z-10 grid border-b border-slate-200"
             style="grid-template-columns: minmax(240px, 28%) 1fr;">
          <div class="p-2 font-bold text-slate-700 text-center border-r border-slate-200 flex items-center justify-center">작업</div>
          <div class="grid" style="grid-template-columns: repeat(${totalDays}, 1fr);">
            ${dateHeaderHTML}
          </div>
        </div>
    `;

    // 각 단계/작업
    wbsData.forEach((phase, idx) => {
      const color = phaseColors[idx % phaseColors.length];

      // 단계 타이틀 Row
      html += `
        <div class="grid" style="grid-template-columns: minmax(240px, 28%) 1fr;">
          <div class="col-span-full bg-slate-100 font-bold p-2 text-slate-600 border-b border-t border-slate-200">${phase.phase}</div>
        </div>
      `;

      // 작업 Row
      phase.tasks.forEach(task => {
        const s = new Date(task.startDate);
        const e = new Date(task.endDate);
        const startCol = dateDiffInDays(projectStartDate, s) + 1; // CSS grid 1-indexed
        const duration = dateDiffInDays(s, e) + 1;

        // 타임라인 셀(주말 음영) + 바
        let cells = "";
        for (let i=0; i<totalDays; i++){
          cells += `<div class="${weekendMask[i] ? 'weekend' : ''}"></div>`;
        }

        html += `
          <div class="grid border-b border-slate-200" style="grid-template-columns: minmax(240px, 28%) 1fr;">
            <!-- 작업 이름 -->
            <div class="p-3 text-sm border-r border-slate-200 truncate flex items-center min-h-[52px]">${task.mid}</div>

            <!-- 타임라인 -->
            <div class="relative grid gantt-grid-bg" style="--days:${totalDays}; grid-template-columns: repeat(${totalDays}, 1fr);">
              ${cells}
              <div class="task-bar relative p-1 h-full" style="grid-column: ${startCol} / span ${duration};">
                <div class="relative w-full h-full rounded-md flex items-center px-3 text-white font-semibold text-sm shadow-md"
                     style="background:${color}">
                  <span class="truncate">${task.mid}</span>
                </div>

                <!-- 팝업 -->
                <div class="task-bar-popup bg-slate-800 text-white p-3 rounded-lg shadow-2xl">
                  <h4 class="font-bold text-base">${task.mid}</h4>
                  <p class="text-xs text-slate-300 mb-2">${task.startDate} ~ ${task.endDate}</p>
                  <ul class="list-disc list-inside text-sm text-slate-200 space-y-1">
                    ${(task.details || []).map(d => `<li>${d}</li>`).join("")}
                  </ul>
                  ${task.output ? `
                    <div class="mt-2 text-right">
                      <span class="inline-block bg-white/20 text-white text-xs font-semibold px-2 py-1 rounded-full">
                        산출물: ${task.output}
                      </span>
                    </div>` : ''}
                </div>
              </div>
            </div>
          </div>
        `;
      });
    });

    html += `</div>`;
    chartContainer.innerHTML = html;
  </script>
</body>
</html>
